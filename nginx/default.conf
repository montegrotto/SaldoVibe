upstream saldovibe_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Bilagor (räkenskapsinformation) får bara nås via Djangos inloggade, företagsskyddade vyer.
    location ~ ^/media/transaction_attachment {
        return 404;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://saldovibe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}