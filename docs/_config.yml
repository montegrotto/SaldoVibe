# GitHub Pages (Jekyll) – publiceras från main:/docs. Ingen lokal byggkedja behövs.
title: SaldoVibe
# Sajten serveras via Cloudflare med HTTPS; utan detta bygger GitHub sitemap med http://.
url: https://www.saldovibe.se
description: "Bokföringsprogram med öppen källkod för svenska företag – självhostat och gratis: BAS-kontoplan, SIE, moms, fakturering, löner med AGI, hash-kedjad revisionslogg."
lang: sv
theme: minima
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
# Interna arbetsdokument som inte hör hemma på webbplatsen (compliance/ läses i repot).
exclude:
  - compliance
  - agent-execution-prompt.md
  - feature-roadmap.md
  - system-replication-spec.md
# Sidtiteln tas från första rubriken – ta bort den ur brödtexten så den inte visas dubbelt.
titles_from_headings:
  strip_title: true
# Search Console-verifiering (jekyll-seo-tag skriver ut meta-taggen).
