<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
      {% endif %}
    </div>
  {% endfor %}
  {% if form.non_field_errors %}
    <div class="alert alert-danger py-2">{{ form.non_field_errors.0 }}</div>
  {% endif %}
  <div class="d-grid mt-3">
    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
  </div>
</form>
