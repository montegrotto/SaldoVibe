[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    "*/migrations/*",
    ".venv",
    "node_modules",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E4", # imports
    "E7", # statement style
    "E9", # syntax errors
    "F",  # pyflakes
    "I",  # import sorting
]

[tool.ruff.lint.per-file-ignores]
# Tests create model objects for their side effects; the assignment names them.
"**/tests.py" = ["F841"]
"**/tests/*" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "attachments",
    "auditlog",
    "banking",
    "bookkeeping",
    "fixed_assets",
    "invoicing",
    "payroll",
    "saldovibe",
    "supplier_invoices",
    "vat",
]
